name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/domains/goodsessentialsllc.com/public_html

            git checkout main
            git fetch origin main
            git reset --hard origin/main

            export PATH=/opt/alt/alt-nodejs20/root/usr/bin:$PATH

            # Clear stale framework caches while dev packages are still
            # installed, so no cached manifest can reference a class that
            # is about to be removed by --no-dev.
            php artisan optimize:clear

            composer install --no-dev --optimize-autoloader --no-interaction

            npm ci

            # esbuild occasionally crashes transiently on this shared host
            # ("the service was stopped") — retry once before failing.
            npm run build || npm run build

            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            curl -sf -o /dev/null https://goodsessentialsllc.com/ && echo "Site is up" || (echo "Site check failed" && exit 1)
